name: SideBot Discord

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: read

concurrency:
  group: sidebot-single-instance
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m py_compile SideBot/bot.py scripts/live_runner.py
      - run: pip install -r requirements.txt
      - name: Restore bot state
        uses: actions/cache/restore@v4
        with:
          path: .state
          key: sidebot-state-${{ github.run_id }}
          restore-keys: |
            sidebot-state-
      - name: Run SideBot with live code updates
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          WELCOME_ROLE_NAME: ${{ vars.WELCOME_ROLE_NAME }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          PYTHONUNBUFFERED: "1"
        shell: bash
        run: |
          test -n "$DISCORD_TOKEN" || { echo 'Missing DISCORD_TOKEN secret'; exit 1; }
          mkdir -p .state
          for file in announced_live.json member_profiles.json tiktok_users.txt twitch_users.txt social_links.json xp_scores.json dayone_access.json free_games_seen.json resource_links.json custom_commands.json message_counts.json badges.json vault_access.json; do
            if [ -f ".state/$file" ]; then cp ".state/$file" "SideBot/$file"; fi
          done
          set +e
          python -u scripts/live_runner.py
          status=$?
          set -e
          for file in announced_live.json member_profiles.json tiktok_users.txt twitch_users.txt social_links.json xp_scores.json dayone_access.json free_games_seen.json resource_links.json custom_commands.json message_counts.json badges.json vault_access.json; do
            if [ -f "SideBot/$file" ]; then cp "SideBot/$file" ".state/$file"; fi
          done
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then exit "$status"; fi
      - name: Save state for next run
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .state
          key: sidebot-state-${{ github.run_id }}
